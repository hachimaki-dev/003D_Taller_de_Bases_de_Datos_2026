<!-- 02 -->
<template v-if="slide.type==='agenda'">
<div class="kicker">01 · Ruta de aprendizaje</div>
<h2>¿Qué vamos a construir hoy?</h2>
<div class="grid3">
<div class="card lav"><div class="big-number">1</div><h3>Recordar</h3><p>Qué hace realmente un cursor explícito y por qué <b>FOR LOOP</b> simplifica su uso.</p></div>
<div class="card blue"><div class="big-number">2</div><h3>Complejizar</h3><p>Agregar <b>JOIN</b>, filtros y alias para trabajar con resultados de varias tablas.</p></div>
<div class="card mint"><div class="big-number">3</div><h3>Parametrizar</h3><p>Crear cursores reutilizables que reciben valores desde el bloque PL/SQL.</p></div>

<!-- 03 -->
<template v-if="slide.type==='prior'">
<div class="kicker">02 · Conexión con la clase anterior</div>
<h2>Ustedes ya saben hacer esto</h2>
<div class="two-col">
<div>
<div class="code-wrap">
<div class="code-head"><span>cursor básico</span><span>PL/SQL</span></div>
<pre><code class="language-plsql">DECLARE
    CURSOR c_clientes IS
        SELECT *
        FROM CLIENTE;
BEGIN
    FOR un_cliente IN c_clientes LOOP
        DBMS_OUTPUT.PUT_LINE(
            'Cliente: ' || un_cliente.NOMBRE
        );
    END LOOP;
END;
/</code></pre>
</div>
</div>
<div class="card lav">
<h3>La idea clave</h3>
<p><b>c_clientes</b> representa el conjunto de filas que devuelve el SELECT.</p>
<p><b>un_cliente</b> representa una fila del resultado durante cada vuelta.</p>
<p>Oracle abre, obtiene, recorre y cierra el cursor automáticamente cuando usamos el <b>FOR LOOP</b>.</p>
</div>
</div>
</template>

<!-- 04 -->
<template v-if="slide.type==='mental'">
<div class="kicker">03 · Modelo mental</div>
<h2>¿Qué ocurre dentro del FOR?</h2>
<div class="flow">
<div class="node b-lav">SELECT → resultado</div><div class="arrow">→</div>
<div class="node b-blue">1 fila</div><div class="arrow">→</div>
<div class="node b-mint">registro</div><div class="arrow">→</div>
<div class="node b-peach">LOOP</div><div class="arrow">→</div>
<div class="node b-yellow">siguiente fila</div>
</div>
<div class="diagram">
<div class="grid3">
<div class="card"><h3>1. Abrir</h3><p>Oracle prepara el cursor para comenzar a recorrer el resultado.</p></div>
<div class="card"><h3>2. Obtener</h3><p>Obtiene una fila y la coloca en el registro implícito del <b>FOR</b>.</p></div>
<div class="card"><h3>3. Repetir</h3><p>Cuando no quedan filas, el ciclo termina y Oracle cierra el cursor.</p></div>
</div>
</div>
<div class="note"><b>Pregunta para el curso:</b> si el SELECT puede tener JOIN, WHERE, GROUP BY u ORDER BY, ¿por qué el cursor no podría?</div>
</template>

<!-- 05 -->
<template v-if="slide.type==='schema'">
<div class="kicker">04 · Nuestra base de datos</div>
<h2>El cursor no vive aislado</h2>
<p>En el clon Punto Ticket, una compra conecta varias entidades. Eso nos permite construir cursores mucho más interesantes.</p>
<div class="diagram center">
<span class="entity"><span class="entity-title">CLIENTE</span><span class="entity-body"><b>cliente_id</b><br>nombre<br>apellido<br>email</span></span>
<span class="rel">→</span>
<span class="entity"><span class="entity-title">RESERVA_TEMPORAL</span><span class="entity-body"><b>reserva_id</b><br>cliente_id<br>localidad_evento_id<br>estado</span></span>
<span class="rel">→</span>
<span class="entity"><span class="entity-title">TRANSACCION_PAGO</span><span class="entity-body"><b>transaccion_id</b><br>reserva_id<br>monto_final<br>estado</span></span>
<span class="rel">→</span>
<span class="entity"><span class="entity-title">TICKET</span><span class="entity-body"><b>ticket_id</b><br>codigo_ticket<br>precio_pagado<br>estado</span></span>
</div>
<div class="note">Esta cadena será nuestra ruta principal para practicar cursores con <b>JOIN</b>.</div>
</template>

<!-- 06 -->
<template v-if="slide.type==='simplejoin'">
<div class="kicker">05 · Nivel 3</div>
<h2>Cursor + JOIN: el primer salto</h2>
<div class="two-col">
<div class="code-wrap">
<div class="code-head"><span>transacciones aprobadas</span><span>3 tablas</span></div>
<pre><code class="language-plsql">DECLARE
    CURSOR c_transacciones IS
        SELECT
            c.nombre,
            c.apellido,
            tp.monto_bruto,
            tp.descuento,
            tp.monto_final,
            tp.estado
        FROM CLIENTE c
        JOIN RESERVA_TEMPORAL r
            ON r.cliente_id = c.cliente_id
        JOIN TRANSACCION_PAGO tp
            ON tp.reserva_id = r.reserva_id
        WHERE tp.estado = 'APROBADO';

BEGIN
    FOR una_transaccion IN c_transacciones LOOP
        DBMS_OUTPUT.PUT_LINE(
            una_transaccion.nombre || ' ' ||
            una_transaccion.apellido || ' → $' ||
            una_transaccion.monto_final
        );
    END LOOP;
END;
/</code></pre>
</div>
<div>
<div class="card mint"><h3>¿Qué devuelve cada fila?</h3>
<ul>
<li>Nombre y apellido del cliente</li>
<li>Monto bruto</li>
<li>Descuento</li>
<li>Monto final</li>
<li>Estado del pago</li>
</ul></div>
<div class="card lav"><h3>Idea importante</h3><p>El cursor trabaja sobre el <b>resultado del SELECT</b>, no sobre una tabla específica.</p></div>
</div>
</div>
</template>

<tr><td>Antonia</td><td>Pérez</td><td>$129.900</td><td>$19.485</td><td><b>$110.415</b></td><td><span class="pill ok">APROBADO</span></td></tr>

<!-- 08 -->
<template v-if="slide.type==='record'">
<div class="kicker">07 · Registro implícito</div>
<h2>¿Qué es <code>una_transaccion</code>?</h2>
<div class="quote">“Una fila del resultado del cursor, disponible como un registro durante la iteración.”</div>
<div class="grid">
<div class="card blue"><h3>Sus campos</h3>
<p><code>una_transaccion.NOMBRE</code></p>
<p><code>una_transaccion.MONTO_FINAL</code></p>
<p><code>una_transaccion.ESTADO</code></p></div>
<div class="card mint"><h3>¿Tengo que declarar el tipo?</h3><p><b>No.</b> En un cursor FOR LOOP, PL/SQL crea automáticamente un registro con los campos que devuelve el cursor.</p></div>
</div>
<div class="note">Regla mental: <b>SELECT define las columnas → cursor define el conjunto → registro representa una fila.</b></div>
</template>

<!-- 09 -->
<template v-if="slide.type==='levels'">
<div class="kicker">08 · Progresión</div>
<h2>¿Qué hace “complejo” a un cursor?</h2>
<div class="grid">
<div class="card lav"><h3>Nivel 1</h3><p><b>Una tabla</b></p><code>SELECT * FROM CLIENTE</code></div>
<div class="card blue"><h3>Nivel 2</h3><p><b>Condiciones</b></p><code>WHERE estado = '...'</code></div>
<div class="card mint"><h3>Nivel 3</h3><p><b>JOIN</b></p><code>CLIENTE → RESERVA → PAGO</code></div>
<div class="card peach"><h3>Nivel 4</h3><p><b>Parámetros</b></p><code>c_clientes(p_estado)</code></div>
<div class="card yellow"><h3>Nivel 5</h3><p><b>JOIN + parámetros</b></p><code>c_pagos(p_cliente_id)</code></div>
<div class="card pink"><h3>Nivel 6</h3><p><b>Cursores anidados</b></p><code>cliente → sus pagos</code></div>
</div>
<div class="note">No es una clasificación oficial de Oracle llamada “cursor complejo”. Es una forma pedagógica de visualizar la progresión de dificultad.</div>
</template>

<!-- 10 -->
<template v-if="slide.type==='params'">
<div class="kicker">09 · Nivel 4</div>
<h2>Cursor con parámetros</h2>
<div class="two-col">
<div class="code-wrap">
<div class="code-head"><span>reutilizable</span><span>PL/SQL</span></div>
<pre><code class="language-plsql">DECLARE
    CURSOR c_clientes_por_estado(
        p_estado VARCHAR2
    ) IS
        SELECT
            cliente_id,
            nombre,
            apellido,
            email
        FROM CLIENTE
        WHERE estado = p_estado;

BEGIN
    FOR un_cliente IN
        c_clientes_por_estado('ACTIVO')
    LOOP
        DBMS_OUTPUT.PUT_LINE(
            un_cliente.nombre
        );
    END LOOP;
END;
/</code></pre>
</div>
<div class="card lav">
<h3>¿Qué cambió?</h3>
<p>El cursor ya no está “amarrado” a un único valor.</p>
<p><code>p_estado</code> recibe información desde el lugar donde invocamos el cursor.</p>
<p>El cursor se vuelve <b>reutilizable</b>.</p>
</div>
</div>
</template>

<!-- 11 -->
<template v-if="slide.type==='paramvisual'">
<div class="kicker">10 · Parámetros</div>
<h2>El cursor es el mismo; cambia el dato</h2>
<div class="flow">
<div class="node b-lav">c_clientes_por_estado</div>
<div class="arrow">→</div>
<div class="node b-blue">('ACTIVO')</div>
<div class="arrow">→</div>
<div class="node b-mint">resultado A</div>
</div>
<div class="flow">
<div class="node b-lav">c_clientes_por_estado</div>
<div class="arrow">→</div>
<div class="node b-peach">('INACTIVO')</div>
<div class="arrow">→</div>
<div class="node b-yellow">resultado B</div>
</div>
<div class="card mint center">
<h3>Una sola definición</h3>
<p>La consulta se define una vez. El parámetro permite cambiar el criterio de búsqueda.</p>
</div>
</template>

<!-- 12 -->

<div class="question">“Quiero obtener las compras aprobadas de un cliente específico. ¿Cómo hacemos que el cursor reciba el <code>CLIENTE_ID</code>?”</div>
<div class="flow">
<div class="node b-lav">CLIENTE_ID</div><div class="arrow">→</div>
<div class="node b-blue">cursor parametrizado</div><div class="arrow">→</div>
<div class="node b-mint">JOIN</div><div class="arrow">→</div>
<div class="node b-peach">pagos aprobados</div>
</div>
<div class="note"><b>Piensa antes de mirar la solución:</b> ¿dónde colocarías el parámetro en el SELECT?</div>
</template>

<!-- 13 -->
<template v-if="slide.type==='paramjoin'">
<div class="kicker">12 · Nivel 5</div>
<h2>JOIN + parámetro</h2>
<div class="code-wrap">
<div class="code-head"><span>compras aprobadas de un cliente</span><span>CLON PUNTO TICKET</span></div>
<pre><code class="language-plsql">DECLARE

    CURSOR c_compras_cliente(
        p_cliente_id NUMBER
    ) IS
        SELECT
            c.nombre,
            c.apellido,
            e.nombre AS evento,
            tp.monto_bruto,
            tp.descuento,
            tp.monto_final,
            tp.metodo_pago
        FROM CLIENTE c
        JOIN RESERVA_TEMPORAL r
            ON r.cliente_id = c.cliente_id
        JOIN LOCALIDAD_EVENTO le
            ON le.localidad_evento_id = r.localidad_evento_id
        JOIN EVENTO e
            ON e.evento_id = le.evento_id
        JOIN TRANSACCION_PAGO tp
            ON tp.reserva_id = r.reserva_id
        WHERE tp.estado = 'APROBADO'
          AND c.cliente_id = p_cliente_id;

BEGIN

    FOR una_compra IN c_compras_cliente(1) LOOP
        DBMS_OUTPUT.PUT_LINE(
            una_compra.nombre || ' ' ||
            una_compra.apellido || ' → ' ||
            una_compra.evento || ' → $' ||
            una_compra.monto_final
        );
    END LOOP;

END;
/</code></pre>
</div>
<div class="note">Observa la separación: <b>p_cliente_id</b> controla qué cliente buscamos; los <b>JOIN</b> determinan cómo llegamos desde el cliente hasta su compra.</div>

<script>
const { createApp } = Vue;

createApp({
    data(){
        return {
            current:0,
            slides:[
                {type:'title'},{type:'agenda'},{type:'prior'},{type:'mental'},
                {type:'schema'},{type:'simplejoin'},{type:'result'},{type:'record'},
                {type:'levels'},{type:'params'},{type:'paramvisual'},{type:'case'},
                {type:'paramjoin'},{type:'ticketpath'},{type:'nested'},{type:'nestedvisual'},
                {type:'manual'},{type:'fetchloop'},{type:'rowtype'},{type:'attributes'},
                {type:'exercise'},{type:'solution'},{type:'mistakes'},{type:'summary'},
                {type:'exit'}
            ]
        }
    },
    computed:{
        progress(){ return ((this.current+1)/this.slides.length)*100 }
    },
    mounted(){
        this.$el.querySelector('.presentation').focus();
        document.addEventListener('keydown', this.handleKey);
        this.highlight();
    },
    updated(){
        this.$nextTick(()=>this.highlight());
    },
    methods:{
        next(){
            if(this.current < this.slides.length-1) this.current++;
        },
        prev(){
            if(this.current > 0) this.current--;
        },
        handleKey(e){
            if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
            if(e.key==='ArrowRight' || e.key==='PageDown' || e.key===' '){
                e.preventDefault(); this.next();
            }
            if(e.key==='ArrowLeft' || e.key==='PageUp'){
                e.preventDefault(); this.prev();
            }
            if(e.key.toLowerCase()==='f'){
                if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
                else document.exitFullscreen?.();
            }
            if(e.key==='Home') this.current=0;
            if(e.key==='End') this.current=this.slides.length-1;
        },
        highlight(){
            document.querySelectorAll('pre code').forEach(el=>{
                if(!el.dataset.hljs) {
                    hljs.highlightElement(el);
                    el.dataset.hljs='1';
                }
            });
        }
    }
}).mount('#app');
</script>
